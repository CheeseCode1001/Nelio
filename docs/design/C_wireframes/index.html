<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nelio — Deliverable C: Low-fidelity wireframes</title>
<style>
  :root{--ink:#1f1f1f;--mid:#6b6b6b;--line:#c9c9c9;--fill:#ececec;--fill2:#f6f6f6;--bg:#fafafa;--accent:#3a3a3a}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:#e4e4e4}
  a{color:inherit}
  .shell{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
  .index{background:#fff;border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
  .index h1{font-size:15px;margin:0 0 2px}
  .index .sub{font-size:12px;color:var(--mid);margin-bottom:10px}
  .index input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;margin-bottom:8px}
  .index h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mid);margin:12px 6px 4px}
  .index a{display:block;padding:3px 6px;border-radius:5px;text-decoration:none;font-size:12.5px}
  .index a:hover{background:var(--fill)}
  .index a.on{background:var(--ink);color:#fff}
  .index a b{display:inline-block;width:54px;font-weight:600;color:var(--mid)}
  .index a.on b{color:#ccc}
  .modes{display:flex;gap:6px;margin-bottom:6px}
  .modes button{flex:1;padding:5px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-size:12px}
  .modes button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  main{padding:20px 24px;overflow:auto}
  .screen{margin-bottom:48px}
  .meta{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;margin-bottom:10px}
  .meta h2{margin:0;font-size:20px}
  .meta code{background:#fff;border:1px solid var(--line);padding:1px 6px;border-radius:4px;font-size:12px}
  .meta .roles{font-size:12px;color:var(--mid)}
  .frames{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
  .frame{background:var(--bg);border:2px solid var(--ink);border-radius:10px;overflow:hidden;font-size:12px;flex:none}
  .frame.d{width:1040px;min-height:560px}
  .frame.m{width:360px;min-height:640px;border-radius:26px;border-width:6px;position:relative;padding-bottom:52px}
  .flabel{font-size:11px;color:var(--mid);margin:0 0 4px 2px;text-transform:uppercase;letter-spacing:.06em}
  .side-notes{flex:1;min-width:280px;max-width:520px}
  .side-notes h4{margin:0 0 4px;font-size:13px}
  .side-notes ol,.side-notes ul{margin:0 0 12px;padding-left:20px}
  .side-notes li{margin-bottom:3px}
  .st{display:inline-block;border:1px dashed var(--mid);border-radius:10px;padding:0 7px;margin:0 4px 4px 0;font-size:11.5px;background:#fff}
  /* chrome */
  .tb{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);background:#fff}
  .tb .sp{flex:1}
  .pill{border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:#fff;white-space:nowrap}
  .pill.dk{background:var(--ink);color:#fff;border-color:var(--ink)}
  .pill.warn{border-style:dashed}
  .ic{width:22px;height:22px;border-radius:50%;background:var(--fill);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:10px;flex:none}
  .logo{font-weight:800;letter-spacing:.02em}
  .appbody{display:grid;grid-template-columns:180px 1fr;min-height:520px}
  .sb{border-right:1px solid var(--line);background:#fff;padding:8px 6px}
  .sb .g{font-size:9.5px;text-transform:uppercase;color:var(--mid);margin:9px 6px 2px;letter-spacing:.06em}
  .sb .i{padding:3px 8px;border-radius:5px;display:flex;justify-content:space-between}
  .sb .i.on{background:var(--ink);color:#fff}
  .sb .i.lock{color:var(--mid)}
  .content{padding:12px 14px;min-width:0}
  .bt{position:absolute;left:0;right:0;bottom:0;height:52px;border-top:1px solid var(--line);background:#fff;display:grid;grid-template-columns:repeat(5,1fr);font-size:10px;text-align:center;align-items:center}
  .bt div.on{font-weight:700;text-decoration:underline}
  .adminstrip{background:var(--ink);color:#fff;padding:4px 10px;font-size:11px;display:flex;justify-content:space-between}
  .ribbon{background:repeating-linear-gradient(45deg,#fff,#fff 6px,var(--fill) 6px,var(--fill) 12px);border-bottom:1px solid var(--line);font-size:10px;text-align:center;padding:2px}
  .center{display:flex;justify-content:center;padding:28px 12px}
  .center>.card{width:400px;max-width:100%}
  /* blocks */
  .blk{margin-bottom:10px}
  .ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ph h5{margin:0;font-size:16px;flex:1}
  .ph .s{width:100%;color:var(--mid);margin-top:-2px}
  .btn{border:1px solid var(--ink);border-radius:6px;padding:3px 9px;background:#fff;white-space:nowrap;display:inline-block}
  .btn.p{background:var(--ink);color:#fff}
  .btn.g{border-color:var(--line);color:var(--mid)}
  .card{border:1px solid var(--line);border-radius:8px;background:#fff;padding:9px}
  .card .t{font-weight:600;margin-bottom:5px}
  .ln{height:7px;background:var(--fill);border-radius:4px;margin:5px 0}
  .ln.s{width:60%}.ln.xs{width:35%}
  .grid{display:grid;gap:8px}
  .kpi .v{height:16px;width:50%;background:var(--line);border-radius:3px;margin-top:4px}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  th,td{text-align:left;padding:5px 7px;border-bottom:1px solid var(--fill)}
  th{background:var(--fill2);font-weight:600;font-size:11px}
  .row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--fill);background:#fff}
  .rows{border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .row .x{flex:1;min-width:0}
  .chip{display:inline-block;border:1px solid var(--line);border-radius:10px;padding:0 7px;font-size:10.5px;background:var(--fill2);white-space:nowrap}
  .chip.dk{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip.dash{border-style:dashed;background:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow:auto}
  .tabs span{padding:4px 10px;white-space:nowrap}
  .tabs span.on{border-bottom:2px solid var(--ink);font-weight:600}
  .split{display:grid;gap:10px}
  .media{background:repeating-linear-gradient(135deg,var(--fill),var(--fill) 8px,#e2e2e2 8px,#e2e2e2 16px);border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--mid);min-height:150px;text-align:center;padding:6px}
  .media.v{aspect-ratio:9/16;min-height:0;max-height:300px;margin:auto}
  .trk{display:grid;grid-template-columns:60px 1fr;gap:4px;align-items:center;margin:3px 0}
  .trk .b{height:14px;background:var(--fill);border:1px solid var(--line);border-radius:3px;position:relative}
  .trk .b i{position:absolute;top:-1px;bottom:-1px;background:var(--line);border:1px solid var(--mid);border-radius:3px}
  .field{margin-bottom:7px}
  .field label{display:block;font-size:11px;color:var(--mid);margin-bottom:2px}
  .inp{border:1px solid var(--line);border-radius:6px;height:24px;background:#fff;padding:3px 7px;color:var(--mid)}
  .inp.ta{height:56px}
  .chk{display:flex;gap:6px;align-items:center;margin-bottom:6px}
  .box{width:12px;height:12px;border:1px solid var(--ink);border-radius:2px;flex:none}
  .box.r{border-radius:50%}
  .bubble{border:1px solid var(--line);border-radius:10px;padding:6px 9px;margin:5px 0;max-width:85%;background:#fff}
  .bubble.me{margin-left:auto;background:var(--fill)}
  .banner{border:1px solid var(--ink);border-radius:7px;padding:6px 9px;display:flex;gap:8px;align-items:center;background:#fff}
  .banner.warn,.banner.err{border-width:2px}
  .banner.mock{border-style:dashed}
  .banner .x{flex:1}
  .empty{border:1px dashed var(--mid);border-radius:10px;padding:22px;text-align:center;background:#fff}
  .hero{text-align:center;padding:26px 12px}
  .hero h5{font-size:22px;margin:0 0 6px}
  .stepper{display:flex;gap:6px;align-items:center}
  .stepper span{flex:1;height:5px;background:var(--fill);border-radius:3px}
  .stepper span.on{background:var(--ink)}
  .chart{height:130px;border:1px solid var(--line);border-radius:8px;background:#fff;position:relative;overflow:hidden}
  .chart svg{position:absolute;inset:0;width:100%;height:100%}
  .chart .lbl{position:absolute;left:8px;top:6px;color:var(--mid)}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
  .cal div{border-right:1px solid var(--fill);border-bottom:1px solid var(--fill);min-height:56px;padding:3px;font-size:10px}
  .meter{margin-bottom:6px}
  .meter .bar{height:8px;background:var(--fill);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
  .meter .bar i{display:block;height:100%;background:var(--mid)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px}
  .kv span:nth-child(odd){color:var(--mid)}
  .modal{border:2px solid var(--ink);border-radius:10px;background:#fff;padding:10px;box-shadow:0 0 0 2000px rgba(0,0,0,.06) inset}
  .modal .mt{font-weight:700;margin-bottom:6px}
  .foot{border-top:1px solid var(--line);padding:10px 14px;color:var(--mid);display:flex;gap:14px;flex-wrap:wrap;background:#fff}
  .note{font-size:11px;color:var(--mid);font-style:italic}
  .m .hide-m{display:none}
  .d .hide-d{display:none}
  @media print{.index{display:none}.shell{display:block}.screen{page-break-after:always}}
</style>
</head>
<body>
<div class="shell">
  <nav class="index">
    <h1>Nelio · Wireframes</h1>
    <div class="sub">Deliverable C · low-fidelity · greyscale on purpose (visual design comes in D)</div>
    <div class="modes"><button id="m1" class="on">One screen</button><button id="m2">All screens</button></div>
    <input id="q" placeholder="Filter (e.g. APP-03, approval)">
    <div id="list"></div>
  </nav>
  <main id="main"></main>
</div>
<script>
/* ---------- chrome definitions ---------- */
const NAV=[
  [null,[['home','Command Center'],['activity','Activity']]],
  ['AI',[['strategist','Strategist'],['agents','Agents']]],
  ['Create',[['media','Clipping Studio'],['content','Content Studio'],['exports','Exports']]],
  ['Publish',[['calendar','Calendar'],['drafts','Drafts'],['approvals','Approvals','4']]],
  ['Grow',[['analytics','Analytics'],['licensing','Licensing']]],
  ['Workspace',[['connections','Connections'],['brandkits','Brand kits'],['settings','Settings']]],
  ['Agency',[['agencyhub','Agency hub'],['clients','Clients'],['team','Team'],['audit','Audit log']]],
  [' ',[['billing','Billing & usage']]]
];
const CREATORNAV=[['c-over','Overview'],['c-verify','Verification'],['c-terms','Licensing terms'],['c-usage','Usage'],['c-rev','Revocations'],['c-pay','Payouts · later']];
const ADMINNAV=[['a-ops','Ops overview'],['a-jobs','Jobs & dead-letter'],['a-audit','Audit search'],['a-lic','License review'],['a-sup','Support access'],['a-abuse','Abuse & moderation'],['a-diag','Diagnostics'],['a-flags','Feature flags']];
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function sidebar(items,active){
  return `<div class="sb">${items.map(([k,l,b])=>`<div class="i ${k===active?'on':''}">${esc(l)}${b?`<span class="chip">${b}</span>`:''}</div>`).join('')}</div>`;
}
function appSidebar(active,agency){
  return `<div class="sb">${NAV.filter(g=>agency||g[0]!=='Agency').map(([g,items])=>
    (g?`<div class="g">${g}</div>`:'')+items.map(([k,l,b])=>`<div class="i ${k===active?'on':''}">${l}${b?`<span class="chip ${k===active?'':'dk'}">${b}</span>`:''}</div>`).join('')).join('')}</div>`;
}
const appTop=(m,ws)=>m
  ?`<div class="tb"><span class="pill">▾ ${ws||'Ada Studio'}</span><span class="sp"></span><span class="ic">⌕</span><span class="ic">❚❚</span><span class="ic">🔔</span><span class="ic">A</span></div>`
  :`<div class="tb"><span class="logo">Nelio</span><span class="pill">▾ ${ws||'Ada Studio'}</span><span class="pill" style="min-width:220px;color:#888">⌕ Search or run a command  ⌘K</span><span class="sp"></span><span class="pill">◔ 1,240 credits</span><span class="pill">❚❚ Pause workspace</span><span class="ic">🔔</span><span class="ic">A</span></div>`;
const bottomTabs=active=>`<div class="bt">${[['home','Home'],['activity','Activity'],['approvals','Approvals ④'],['calendar','Calendar'],['more','More']].map(([k,l])=>`<div class="${k===active?'on':''}">▢<br>${l}</div>`).join('')}</div>`;
const pubTop=m=>`<div class="tb"><span class="logo">Nelio</span><span class="sp"></span>${m?'<span class="ic">≡</span>':'<span>Product</span><span>Use cases</span><span>Pricing</span><span>Licensing</span><span>FAQ</span><span class="btn g">Log in</span><span class="btn p">Start free</span>'}</div>`;
const pubFoot=`<div class="foot"><b>Nelio</b><span>Product</span><span>Pricing</span><span>Licensing</span><span>Status</span><span>Terms</span><span>Privacy</span><span>Takedown</span></div>`;

/* ---------- block renderer ---------- */
function R(b,m){
  if(!b) return '';
  if(typeof b==='string') return `<div class="blk">${esc(b)}</div>`;
  const [t,...a]=b;
  const W=h=>`<div class="blk">${h}</div>`;
  switch(t){
    case 'head': { const [title,acts=[],sub]=a; return W(`<div class="ph"><h5>${esc(title)}</h5>${acts.map((x,i)=>`<span class="btn ${i===acts.length-1?'p':''}">${esc(x)}</span>`).join('')}${sub?`<div class="s">${esc(sub)}</div>`:''}</div>`); }
    case 'banner': { const [k,txt,cta]=a; return W(`<div class="banner ${k}"><span class="chip ${k==='mock'?'dash':'dk'}">${{warn:'!',err:'×',info:'i',mock:'MOCK',ok:'✓'}[k]||k}</span><span class="x">${esc(txt)}</span>${cta?`<span class="btn">${esc(cta)}</span>`:''}</div>`); }
    case 'kpis': return W(`<div class="grid" style="grid-template-columns:repeat(${m?2:a[0].length},1fr)">${a[0].map(l=>`<div class="card kpi"><div class="note" style="font-style:normal">${esc(l)}</div><div class="v"></div></div>`).join('')}</div>`);
    case 'cards': { const [items,cols]=a; return W(`<div class="grid" style="grid-template-columns:repeat(${m?1:(cols||Math.min(items.length,3))},1fr)">${items.map(x=>{const [tt,ch]=Array.isArray(x)?x:[x];return `<div class="card"><div class="t">${esc(tt)} ${ch?`<span class="chip">${esc(ch)}</span>`:''}</div><div class="ln"></div><div class="ln s"></div></div>`}).join('')}</div>`); }
    case 'table': { const [cols,rows]=a; const n=typeof rows==='number'?rows:rows.length;
      if(m) return W(`<div class="rows">${Array.from({length:Math.min(n,5)},(_,i)=>Array.isArray(rows)
        ?`<div class="row"><span class="x"><b>${esc(rows[i][0])}</b><div class="note" style="font-style:normal">${rows[i].slice(1).map((v,j)=>esc(cols[j+1])+': '+esc(v)).join(' · ')}</div></span></div>`
        :`<div class="row"><span class="x"><b>${esc(cols[0]+' '+(i+1))}</b><div class="ln s"></div></span><span class="chip">${esc(cols[cols.length-1])}</span></div>`).join('')}</div>`);
      return W(`<table><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${Array.from({length:n},(_,i)=>`<tr>${cols.map((c,j)=>`<td>${Array.isArray(rows)?(rows[i][j]!==undefined?esc(rows[i][j]):''):(j===0?esc(c)+' '+(i+1):'<div class="ln s"></div>')}</td>`).join('')}</tr>`).join('')}</table>`); }
    case 'list': return W(`<div class="rows">${a[0].map(x=>{const [tt,ch,sub]=Array.isArray(x)?x:[x];return `<div class="row"><span class="ic"></span><span class="x">${esc(tt)}${sub?`<div class="note" style="font-style:normal">${esc(sub)}</div>`:''}</span>${ch?`<span class="chip">${esc(ch)}</span>`:''}</div>`}).join('')}</div>`);
    case 'feed': return W(`<div class="rows">${a[0].map(([st,tx,tm])=>`<div class="row"><span class="chip ${/fail|blocked|unknown/.test(st)?'dk':''}">${esc(st)}</span><span class="x">${esc(tx)}</span><span class="note">${esc(tm||'')}</span></div>`).join('')}</div>`);
    case 'form': return W(a[0].map(f=>{
      if(f.startsWith('[]')) return `<div class="chk"><span class="box"></span>${esc(f.slice(2))}</div>`;
      if(f.startsWith('()')) return `<div class="chk"><span class="box r"></span>${esc(f.slice(2))}</div>`;
      if(f.startsWith('!')) return `<div style="margin-top:6px"><span class="btn p" style="display:block;text-align:center;padding:6px">${esc(f.slice(1))}</span></div>`;
      if(f.startsWith('~')) return `<div style="margin-top:4px;text-align:center" class="note">${esc(f.slice(1))}</div>`;
      if(f.startsWith('#')) return `<div class="field"><label>${esc(f.slice(1))}</label><div class="inp ta"></div></div>`;
      if(f.startsWith('▾')) return `<div class="field"><label>${esc(f.slice(1))}</label><div class="inp">▾</div></div>`;
      return `<div class="field"><label>${esc(f)}</label><div class="inp"></div></div>`;}).join(''));
    case 'chips': return W(`<div class="chips">${a[0].map((c,i)=>`<span class="chip ${a[1]===i?'dk':''}">${esc(c)}</span>`).join('')}</div>`);
    case 'tabs': return W(`<div class="tabs">${a[0].map((x,i)=>`<span class="${i===(a[1]||0)?'on':''}">${esc(x)}</span>`).join('')}</div>`);
    case 'split': { const [l,r,ratio='2:1']=a; const [x,y]=ratio.split(':');
      return `<div class="split blk" style="grid-template-columns:${m?'1fr':x+'fr '+y+'fr'}"><div>${l.map(z=>R(z,m)).join('')}</div><div>${r.map(z=>R(z,m)).join('')}</div></div>`; }
    case 'cols': return `<div class="split blk" style="grid-template-columns:${m?'1fr':`repeat(${a[0].length},1fr)`}">${a[0].map(c=>`<div>${c.map(z=>R(z,m)).join('')}</div>`).join('')}</div>`;
    case 'box': { const [title,inner]=a; return W(`<div class="card"><div class="t">${esc(title)}</div>${inner.map(z=>R(z,m)).join('')}</div>`); }
    case 'video': return W(`<div class="media ${a[1]==='v'?'v':''}">${esc(a[0]||'Video preview')}</div>`);
    case 'timeline': return W(`<div class="card"><div class="t">${esc(a[0]||'Timeline')}</div>${(a[1]||['Video','Captions','Overlay','Audio']).map((tr,i)=>`<div class="trk"><span class="note" style="font-style:normal">${esc(tr)}</span><div class="b"><i style="left:${5+i*7}%;width:${55-i*6}%"></i></div></div>`).join('')}</div>`);
    case 'transcript': return W(`<div class="card"><div class="t">Transcript <span class="chip dash">mock transcript</span></div>${['00:12 · Speaker 1','00:19 · Speaker 2','00:31 · Speaker 1','00:47 · Speaker 1','01:05 · Speaker 2'].map((s,i)=>`<div style="margin:4px 0;${i===1?'background:var(--fill);border-radius:4px;padding:2px':''}"><span class="note" style="font-style:normal">${s}</span><div class="ln"></div></div>`).join('')}</div>`);
    case 'chat': return W(`<div>${a[0].map(([w,tx])=>`<div class="bubble ${w==='u'?'me':''}">${w==='u'?'':'<span class="chip dash">Demo AI</span> '}${esc(tx)}</div>`).join('')}</div>`);
    case 'chart': return W(`<div class="chart"><span class="lbl">${esc(a[0]||'Chart')}</span><svg viewBox="0 0 300 100" preserveAspectRatio="none"><polyline fill="none" stroke="#888" stroke-width="2" points="0,80 40,70 80,74 120,52 160,58 200,40 240,44 300,22"/></svg></div>`);
    case 'calendar': return W(`<div class="cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div style="min-height:0;font-weight:600;background:var(--fill2)">${d}</div>`).join('')}${Array.from({length:m?7:14},(_,i)=>`<div>${i+10}${[1,3,4,8,11].includes(i)?`<div class="chip" style="display:block;margin-top:3px">▢ ${['IG','YT','IG+YT','YT','IG'][[1,3,4,8,11].indexOf(i)]}</div>`:''}${i===4?'<div class="chip dk" style="display:block;margin-top:3px">needs approval</div>':''}</div>`).join('')}</div>`);
    case 'steps': return W(`<div class="stepper">${a[0].map((_,i)=>`<span class="${i<=a[1]?'on':''}"></span>`).join('')}</div><div class="note" style="margin-top:3px">Step ${a[1]+1} of ${a[0].length} · ${esc(a[0][a[1]])}</div>`);
    case 'empty': return W(`<div class="empty"><div class="ic" style="width:34px;height:34px;margin:0 auto 6px"></div><b>${esc(a[0])}</b>${a[2]?`<div class="note">${esc(a[2])}</div>`:''}<div style="margin-top:8px"><span class="btn p">${esc(a[1])}</span></div></div>`);
    case 'hero': return W(`<div class="hero"><h5>${esc(a[0])}</h5><div class="note" style="font-style:normal">${esc(a[1])}</div><div style="margin-top:10px">${(a[2]||[]).map((x,i)=>`<span class="btn ${i===0?'p':''}" style="margin:0 4px">${esc(x)}</span>`).join('')}</div></div>`);
    case 'meters': return W(`<div class="card">${a[0].map(([l,p,t])=>`<div class="meter"><div style="display:flex;justify-content:space-between"><span>${esc(l)}</span><span class="note" style="font-style:normal">${esc(t||'')}</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`).join('')}</div>`);
    case 'kv': return W(`<div class="kv">${a[0].map(([k,v])=>`<span>${esc(k)}</span><span>${esc(v)}</span>`).join('')}</div>`);
    case 'modal': return W(`<div class="modal"><div class="mt">${esc(a[0])}</div>${a[1].map(z=>R(z,m)).join('')}</div>`);
    case 'text': return `<div class="blk"><div>${esc(a[0])}</div><div class="ln"></div><div class="ln s"></div></div>`;
    case 'note': return `<div class="blk note">✎ ${esc(a[0])}</div>`;
    case 'btns': return W(a[0].map((x,i)=>`<span class="btn ${i===0?'p':''}" style="margin-right:5px">${esc(x)}</span>`).join(''));
    default: return W(`[${esc(t)}]`);
  }
}

function frame(s,m){
  const body=(s.mbody&&m?s.mbody:s.body).map(b=>R(b,m)).join('');
  const L=s.layout;
  const ribbon='<div class="ribbon">Prototype · mock data</div>';
  if(L==='public') return `${pubTop(m)}<div class="content">${body}</div>${pubFoot}`;
  if(L==='auth') return `<div class="tb"><span class="logo">Nelio</span></div><div class="center"><div class="card">${body}</div></div>`;
  if(L==='onb') return `<div class="tb"><span class="logo">Nelio</span><span class="sp"></span><span class="btn g">Skip for now</span></div><div class="center"><div class="card" style="width:520px">${body}</div></div>`;
  if(L==='app'||L==='agency') return ribbon+appTop(m,s.ws)+(m?`<div class="content">${body}</div>${bottomTabs(s.tab||s.nav)}`:`<div class="appbody">${appSidebar(s.nav,L==='agency'||s.agency)}<div class="content">${body}</div></div>`);
  if(L==='portal') return ribbon+`<div class="tb"><span class="ic">◩</span><b>BrightReach Agency</b><span class="pill">Acme Foods</span><span class="sp"></span><span class="ic">🔔</span><span class="ic">C</span></div><div class="content">${body}</div>`;
  if(L==='creator') return ribbon+`<div class="tb"><span class="logo">Nelio</span><span class="pill">Creator Portal</span><span class="sp"></span><span class="ic">🔔</span><span class="ic">K</span></div>`+(m?`<div class="content">${body}</div>`:`<div class="appbody">${sidebar(CREATORNAV,s.nav)}<div class="content">${body}</div></div>`);
  if(L==='admin') return `<div class="adminstrip"><span>NELIO ADMIN</span><span>Your actions here are audited · session #A-2291</span></div><div class="tb"><span class="logo">Nelio</span><span class="pill dk">Admin</span><span class="sp"></span><span class="pill">❚❚ Global pause</span><span class="ic">P</span></div>`+(m?`<div class="content">${body}</div>`:`<div class="appbody">${sidebar(ADMINNAV,s.nav)}<div class="content">${body}</div></div>`);
  if(L==='system') return `<div class="tb"><span class="logo">Nelio</span></div><div class="content">${body}</div>`;
  if(L==='overlay') return ribbon+appTop(m)+(m?`<div class="content">${body}</div>${bottomTabs('home')}`:`<div class="appbody">${appSidebar('home')}<div class="content">${body}</div></div>`);
  return body;
}

function screenHTML(s){
  return `<section class="screen" id="${s.id}">
   <div class="meta"><h2>${s.id} · ${esc(s.title)}</h2><code>${esc(s.route)}</code><span class="roles">Roles: ${esc(s.roles)}</span></div>
   <div class="frames">
     <div><div class="flabel">Desktop</div><div class="frame d">${frame(s,false)}</div></div>
     <div><div class="flabel">Mobile</div><div class="frame m">${frame(s,true)}</div></div>
     <div class="side-notes">
       ${s.notes&&s.notes.length?`<h4>Notes</h4><ol>${s.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ol>`:''}
       <h4>States to design</h4><div>${(s.states||[]).map(x=>`<span class="st">${esc(x)}</span>`).join('')}</div>
       ${s.trace?`<h4 style="margin-top:12px">Traces to</h4><div class="note" style="font-style:normal">${esc(s.trace)}</div>`:''}
     </div>
   </div></section>`;
}

<script>
const G=[...new Set(SCREENS.map(s=>s.group))];
let mode='one', cur=location.hash.slice(1)||SCREENS[0].id;
function renderList(){
  const q=document.getElementById('q').value.toLowerCase();
  document.getElementById('list').innerHTML=G.map(g=>{
    const items=SCREENS.filter(s=>s.group===g&&(!q||(s.id+' '+s.title+' '+s.route).toLowerCase().includes(q)));
    if(!items.length) return '';
    return `<h3>${g}</h3>`+items.map(s=>`<a href="#${s.id}" class="${s.id===cur&&mode==='one'?'on':''}"><b>${s.id}</b>${esc(s.title)}</a>`).join('');
  }).join('')+`<h3>Count</h3><div class="note" style="padding:0 6px">${SCREENS.length} screens</div>`;
}
function renderMain(){
  const main=document.getElementById('main');
  if(mode==='all'){ main.innerHTML=SCREENS.map(screenHTML).join(''); if(cur){const el=document.getElementById(cur); el&&el.scrollIntoView();} }
  else { const s=SCREENS.find(x=>x.id===cur)||SCREENS[0]; main.innerHTML=screenHTML(s); main.scrollTop=0; window.scrollTo(0,0); }
  renderList();
}
window.addEventListener('hashchange',()=>{cur=location.hash.slice(1);renderMain();});
document.getElementById('q').addEventListener('input',renderList);
document.getElementById('m1').onclick=()=>{mode='one';m1.className='on';m2.className='';renderMain();};
document.getElementById('m2').onclick=()=>{mode='all';m2.className='on';m1.className='';renderMain();};
renderMain();
</script>
